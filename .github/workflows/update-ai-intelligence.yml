name: Update AI Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "20 13 * * 1-5"

permissions:
  contents: write

jobs:
  update-ai-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip yfinance requests pandas

      - name: Record protected map fingerprints
        run: sha256sum generate_digest.py investment-map.html > /tmp/protected-files.sha256

      - name: Generate AI Intelligence files
        env:
          SEC_USER_AGENT: "Stock Digest AI Intelligence support@winnersstock.com"
        run: python generate_ai_intelligence.py

      - name: Verify protected map files did not change
        run: sha256sum --check /tmp/protected-files.sha256

      - name: Commit only AI Intelligence outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-intelligence.html ai_company_data.json
          if git diff --cached --quiet; then
            echo "No AI Intelligence changes to commit."
          else
            git commit -m "Update AI intelligence data"
            git push
          fi
